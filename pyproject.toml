[build-system]
requires = ["hatchling>=1.27", "editables>=0.3"]
build-backend = "hatchling.build"

[project]
name = "yapit"
dynamic = ["version"]
description = "Local personal-voice narration and vertical reel planning"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "pydantic>=2.10",
  "numpy>=1.26",
  "soundfile>=0.13",
  "imageio-ffmpeg>=0.6",
  "Pillow>=11",
  "typer>=0.16",
  "python-dotenv>=1",
]

[project.optional-dependencies]
voice = ["qwen-tts>=0.1.1", "torch>=2.6"]
pocket = ["pocket-tts>=4.0.1"]
cloud = ["openai>=1.100"]
rescript = ["faster-whisper>=1.2.1"]
mcp = ["mcp>=1.20"]
train = ["qwen-tts>=0.1.1", "torch>=2.6", "tensorboard>=2.19", "safetensors>=0.4.3"]
dev = ["pytest>=8.3", "ruff>=0.12", "build>=1.2", "mcp>=1.20"]

[project.scripts]
yapit = "yapit.cli:app"
yapit-mcp = "yapit.mcp.server:main"

[tool.hatch.build]
dev-mode-dirs = ["."]

[tool.hatch.version]
path = "VERSION"
pattern = '^(?P<version>\S+)\s*$'

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = {"src" = "yapit"}

[tool.hatch.build.targets.sdist]
exclude = ["/data/**", "/.vscode/**", "/.repo-stats/**"]

[tool.hatch.build.hooks.custom]
path = "scripts/hatch-build.py"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["yapit"]
known-third-party = ["mcp"]

[tool.pytest.ini_options]
markers = [
  "agent: packaging, documentation, cold-import and agent-maintenance checks (non-rapid only)",
  "integration: real media, GUI, subprocess or cross-module workflows (explicit opt-in)",
  "llm: model inference or model-dependent tests (explicit opt-in)",
]
testpaths = [
  "src/tests",
  "tests",
  "src/enrollment/tests",
  "src/rescript/tests",
  "src/yapper/tests",
  "src/editor/tests",
  "src/training/tests",
  "src/mcp/tests",
  "src/common_utils/tests",
  "src/musicgen/tests",
  "src/studio/tests",
]
