[build-system]
requires = ["hatchling>=1.27,<2", "editables>=0.3,<1"]
build-backend = "hatchling.build"

[project]
name = "yapit"
dynamic = ["version"]
description = "Local personal-voice narration and vertical reel planning"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
dependencies = [
  "pydantic>=2.10,<3",
  "numpy>=1.26,<3",
  "soundfile>=0.13,<0.14",
  "imageio-ffmpeg>=0.6,<0.7",
  "Pillow>=11,<13",
  "typer>=0.16,<1",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
voice = ["qwen-tts==0.1.1", "torch>=2.6,<3"]
pocket = ["pocket-tts>=4.0.1,<5"]
cloud = ["openai>=1.100,<3"]
rescript = ["faster-whisper>=1.2.1,<2"]
mcp = ["mcp>=1.20,<2"]
train = ["qwen-tts==0.1.1", "torch>=2.6,<3", "tensorboard>=2.19,<3", "safetensors>=0.4.3,<1"]
dev = ["pytest>=8.3,<10", "ruff>=0.12,<1", "build>=1.2,<2", "mcp>=1.20,<2"]

[project.scripts]
yapit = "yapit.cli:app"
yapit-mcp = "yapit.mcp.server:main"

[tool.hatch.build]
dev-mode-dirs = ["."]

[tool.hatch.version]
path = "VERSION"
pattern = '^(?P<version>\S+)\s*$'

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = {"src" = "yapit"}

[tool.hatch.build.targets.sdist]
exclude = ["/data/**", "/.vscode/**", "/.repo-stats/**"]

[tool.hatch.build.hooks.custom]
path = "scripts/hatch-build.py"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["yapit"]
known-third-party = ["mcp"]

[tool.pytest.ini_options]
markers = [
  "agent: packaging, documentation, cold-import and agent-maintenance checks (non-rapid only)",
  "integration: real media, GUI, subprocess or cross-module workflows (explicit opt-in)",
  "llm: model inference or model-dependent tests (explicit opt-in)",
]
testpaths = [
  "agenttests",
  "tests",
  "src/enrollment/tests",
  "src/rescript/tests",
  "src/yapper/tests",
  "src/editor/tests",
  "src/training/tests",
  "src/mcp/tests",
  "src/common_utils/tests",
  "src/musicgen/tests",
]
